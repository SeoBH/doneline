# 자동 검증(CI). main에 push하거나 PR을 열면 GitHub 서버에서 두 작업을 동시에 실행한다.
# - test: 임시 PostgreSQL을 띄워 마이그레이션 → 초기 데이터 → 서버 통합 테스트를 돌린다.
# - docker: Dockerfile로 실행 이미지가 만들어지는지 확인한다(이미지를 어디에도 올리지 않음).
# 브라우저 테스트는 Windows의 Edge가 필요해 CI에서는 실행하지 않는다(로컬 npm run test:browser).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연속으로 push하면 이전 실행을 취소해 실행 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 작업이 끝나면 사라지는 테스트 전용 DB. 비밀번호는 이 임시 DB에서만 쓰는 값이다.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: 의존성 설치
        run: npm ci --prefix backend && npm ci --include=dev --prefix frontend
      - name: 테스트 DB 준비(관리 계정으로 앱 계정·DB 생성 후 마이그레이션)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE doneline_app LOGIN PASSWORD 'ci_app_password'" -c "CREATE DATABASE doneline_test"
          PGDATABASE=doneline_test node backend/migrate.cjs
      - name: 앱 설정 파일 작성(.env, 실행마다 새 세션 키)
        run: |
          printf 'PGHOST=127.0.0.1\nPGPORT=5432\nPGDATABASE=doneline_test\nPGUSER=doneline_app\nPGPASSWORD=ci_app_password\nSESSION_SECRET=%s\nAPP_ORIGIN=http://127.0.0.1:3100\nPORT=3100\nSLACK_WEBHOOK_URL=\n' "$(openssl rand -hex 32)" > .env
      - name: 빌드(타입 검사 포함)
        run: npm run build
      - name: 초기 데이터(seed)
        run: PGDATABASE=doneline_test npm run seed
      - name: 서버 통합 테스트
        run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 실행 이미지 빌드 확인
        run: docker build -t doneline:ci .
